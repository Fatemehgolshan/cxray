# CXRay configuration profile — DDR5-only baseline (no CXL overhead)
# Same DRAM backend as cxl_2.0.cfg (DDR5-4800), all CXL protocol overhead zeroed.
# Used to isolate DRAM-only latency as a baseline for T3/T5 MLP sweeps.

cxl_version = 2.0
link.pcie_gen = 5
link.pcie_lanes = 16
link.host_port_latency_ns = 0
link.link_phys_latency_ns = 0
link.device_port_latency_ns = 0
link.flit_size_bytes = 66
link.flit_payload_bytes = 64
link.fec_enable = false
link.fec_decode_latency_ns = 0
link.retry_prob_per_flit = 1e-12
link.vc_arbitration_ns = 0
link.credits.m2s_req = 9999
link.credits.m2s_rwd = 9999
link.credits.s2m_ndr = 9999
link.credits.s2m_drs = 9999
has_switch = false
device.controller_latency_ns = 0
device.dram_type = ddr5_4800
device.coherence_overhead_ns = 0
device.ide_enable = false
host_overhead_ns = 0
ras.enable = false
numa.num_nodes = 1
migration.enable = false
multihost.num_hosts = 1
multihost.per_host_credits = 16
multihost.downstream_bw_GBps = 0
multihost.separate_upstream_links = true
