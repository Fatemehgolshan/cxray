# CXRay configuration profile — CXL 3.0 with 2-socket NUMA
# PCIe 6.0 x8 PAM4, 256-byte FLITs, RS-FEC, DDR5-4800.
# 2-socket NUMA topology with UPI interconnect + page migration enabled.

cxl_version = 3.0
link.pcie_gen = 6
link.pcie_lanes = 8
link.host_port_latency_ns = 12
link.link_phys_latency_ns = 2
link.device_port_latency_ns = 10
link.flit_size_bytes = 256
link.flit_payload_bytes = 236
link.fec_enable = true
link.fec_decode_latency_ns = 4.0
link.retry_prob_per_flit = 1e-10
link.vc_arbitration_ns = 1.5
link.credits.m2s_req = 32
link.credits.m2s_rwd = 16
link.credits.s2m_ndr = 32
link.credits.s2m_drs = 32
has_switch = false
switch.mode = pbr
switch.latency_ns = 40
switch.num_hops = 1
switch.queue_capacity_flits = 32
device.controller_latency_ns = 18
device.dram_type = ddr5_4800
device.coherence_overhead_ns = 0
device.ide_enable = false
host_overhead_ns = 97
ras.enable = false
# Fabric
fabric.p2p_enable = false
fabric.gim_enable = false
# 2-socket NUMA topology
numa.num_nodes = 2
numa.upi_latency_ns = 45
numa.requester_node = 0
# Page migration: hot pages migrate from CXL to local DRAM
migration.enable = true
migration.hot_threshold = 10
migration.bw_gbps = 20
