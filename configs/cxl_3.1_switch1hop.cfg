# CXRay — CXL 3.1 with 1-hop HBR/PBR switch
# Gen6×8, DDR5-4800, RS-FEC, IDE, timing-approximate RAS subset.
# Switch adds 40 ns cut-through per hop each direction.

cxl_version = 3.1
host_overhead_ns = 97
link.pcie_gen = 6
link.pcie_lanes = 8
link.host_port_latency_ns = 12
link.link_phys_latency_ns = 2
link.device_port_latency_ns = 10
link.flit_size_bytes = 256
link.flit_payload_bytes = 236
link.fec_enable = true
link.fec_decode_latency_ns = 4.0
link.vc_arbitration_ns = 1.5
link.credits.m2s_req = 32
link.credits.m2s_rwd = 16
has_switch = true
switch.mode = pbr
switch.latency_ns = 40
switch.num_hops = 1
switch.queue_capacity_flits = 32
device.type = 3
device.controller_latency_ns = 18
device.dram_type = ddr5_4800
device.coherence_overhead_ns = 0
device.ide_enable = true
device.ide_latency_ns = 8.0
device.bi_enable = false
device.bi_rtt_ns = 0
fabric.gim_enable = false
ras.enable = true
ras.scrub_interval_us = 100
ras.sppr_enable = true
ras.hppr_enable = true
ras.data_poison = true
ras.viral = true
device.dram_backend = analytical
# Multi-host downstream link: 68.0 GB/s keeps N=4 exactly at the stability boundary.
# At 4.57 GB/s/host (sequential-read, 4 cores), N=4 aggregate approaches saturation;
# DL utilization: N=1 ≈ 25%, N=2 ≈ 50%, N=4 ≈ 99% (at-capacity).
multihost.downstream_bw_GBps = 68.0
# Per-host credits = 32 (= m2s_req); each host gets full credit pool.
multihost.per_host_credits = 32
