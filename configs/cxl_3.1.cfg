# CXRay configuration profile — CXL 3.1
# PCIe 6.0 x8 PAM4, 256-byte FLITs, RS-FEC, DDR5-4800.
# RAS timing model (scrub, sPPR, hPPR, poison, simplified CVME/DBIT/viral) + IDE.
# Note: coherence_overhead_ns below is only active when device.type = 2 (Type 2 coherent).
# This is a Type 3 (memory expander) config; the coherence field is kept for Type-2 clones.

# Simulation mode: "fast" (analytical) or "detailed" (event-driven, slower)
# sim_mode = detailed
cxl_version = 3.1
link.pcie_gen = 6
link.pcie_lanes = 8
link.host_port_latency_ns = 12
link.link_phys_latency_ns = 2
link.device_port_latency_ns = 10
# Gen6 PAM4: 256-byte FLITs, RS-FEC decode adds 4 ns per direction
link.flit_size_bytes = 256
link.flit_payload_bytes = 236
link.fec_enable = true
link.fec_decode_latency_ns = 4.0
link.retry_prob_per_flit = 1e-10
link.vc_arbitration_ns = 1.5
link.credits.m2s_req = 32
link.credits.m2s_rwd = 16
link.credits.s2m_ndr = 32
link.credits.s2m_drs = 32
has_switch = false
switch.mode = pbr
switch.latency_ns = 40
switch.num_hops = 1
switch.queue_capacity_flits = 32
device.controller_latency_ns = 18
device.dram_type = ddr5_4800
# CXL.cache DCOH snoop-filter lookup — active only for Type 2 (coherent) devices.
# Inactive in this Type 3 config; retained as a reference value for cxl_3.1_type2.cfg.
device.coherence_overhead_ns = 3.0
# IDE: AES-256-GCM mandatory for multi-tenant CXL 3.1 (TSP + IDE §4.5)
device.ide_enable = true
device.ide_latency_ns = 8.0
host_overhead_ns = 97
ras.enable = true
ras.scrub_interval_us = 100
ras.sppr_enable = true
ras.hppr_enable = true
ras.data_poison = true
ras.viral = true
ras.dbit_enable = true
fabric.p2p_enable = false
fabric.gim_enable = false
device.bi_enable = true
device.bi_rtt_ns = 230
device.tsp_enable = true
device.tsp_key_rotation_mb = 64
numa.num_nodes = 1
migration.enable = false
multihost.num_hosts = 1
multihost.per_host_credits = 16
multihost.downstream_bw_GBps = 0
multihost.separate_upstream_links = true
