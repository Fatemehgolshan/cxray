# CXRay — CXL 3.1 Type 2 device (accelerator+HDM, CXL.cache)
# Adds DCOH snoop-filter lookup (3 ns) on every request.
# Adds Back-Invalidation RTT (230 ns) on host write requests.
# Gen6×8, DDR5-4800, RS-FEC, IDE, timing-approximate RAS subset.

cxl_version = 3.1
host_overhead_ns = 97
link.pcie_gen = 6
link.pcie_lanes = 8
link.host_port_latency_ns = 12
link.link_phys_latency_ns = 2
link.device_port_latency_ns = 10
link.flit_size_bytes = 256
link.flit_payload_bytes = 236
link.fec_enable = true
link.fec_decode_latency_ns = 4.0
link.vc_arbitration_ns = 1.5
link.credits.m2s_req = 32
link.credits.m2s_rwd = 16
has_switch = false
device.type = 2
device.controller_latency_ns = 18
device.dram_type = ddr5_4800
device.coherence_overhead_ns = 3.0
device.ide_enable = true
device.ide_latency_ns = 8.0
device.bi_enable = true
device.bi_rtt_ns = 230
device.tsp_enable = true
device.tsp_key_rotation_mb = 64
fabric.gim_enable = false
ras.enable = true
ras.scrub_interval_us = 100
ras.sppr_enable = true
ras.hppr_enable = true
ras.data_poison = true
ras.viral = true
