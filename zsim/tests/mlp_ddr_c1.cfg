// DDR L-B sweep: MLP=1 chain(s), 256MB pointer chase
patchSchedAffinity = true;
sys = {
    cores = { c = { cores = 1; type = "OOO"; dcache = "l1d"; icache = "l1i"; }; };
    caches = {
        l1d = { caches = 1; size = 49152;  latency = 5;  array = { type = "SetAssoc"; ways = 12; }; mshrs = 16; };
        l1i = { caches = 1; size = 32768;  latency = 3;  array = { type = "SetAssoc"; ways = 8;  }; mshrs = 8; };
        l2  = { caches = 1; size = 524288; latency = 14; array = { type = "SetAssoc"; ways = 8;  }; mshrs = 32; children = "l1i|l1d"; };
        l3  = { type = "Timing"; caches = 1; banks = 1; size = 8388608; latency = 44;
                array = { type = "SetAssoc"; hash = "H3"; ways = 16; };
                children = "l2"; mshrs = 64; };
    };
    frequency = 2700;
    lineSize = 64;
    mem = {
        type = "DDR";
        tech = "DDR5-2666-CL20";
        ranksPerChannel = 2;
        banksPerRank = 8;
    };
};
sim = {
    strictConfig = false;
    gmMBytes = 4096;
    maxTotalInstrs = 100000000L;
    deadlockDetection = false;
    aslr = true;
};
process0 = {
    env = "OMP_NUM_THREADS=1 OMP_PROC_BIND=false";
    command = "/tmp/mlp1";
};
