// rebuttal M8b: migration case study, xgboost, 16 cores, setting = full
// policy freqThreshold, 512 pages/epoch, hot threshold 8, fast tier 2048 MB, credits REQ 32 / RWD 16; system from xeon_cxl_c16.cfg
// Intel Xeon Gold 6248 model — 16 cores — CXL memory
// L1D/I: 32KB 8-way  L2: 1MB 16-way (per-core)  L3: 28MB 14-way shared (banks=16)
// CXL 2.0 Gen5x16: hostOverheadNs=97 linkOneWayNs=24
patchSchedAffinity = true;
sys = {
    cores = {
        c = {
            cores = 16;
            type = "OOO";
            dcache = "l1d";
            icache = "l1i";
        };
    };
    caches = {
        l1d = { caches = 16; size = 32768;    latency = 5;  array = { type = "SetAssoc"; ways = 8;  }; mshrs = 16; };
        l1i = { caches = 16; size = 32768;    latency = 4;  array = { type = "SetAssoc"; ways = 8;  }; mshrs = 8;  };
        l2  = { caches = 16; size = 1048576;  latency = 14; array = { type = "SetAssoc"; ways = 16; }; mshrs = 32; children = "l1i|l1d"; };
        l3  = { type = "Timing"; caches = 1; banks = 16; size = 29360128; latency = 44;
                array = { type = "SetAssoc"; hash = "H3"; ways = 14; };
                children = "l2"; mshrs = 512; };
    };
    frequency = 2700;
    lineSize = 64;
    mem = {
        type = "Tiering";
        controllers = 1;
        pageSize = 4096L;
        placementPolicy = "fastFirst";          # first-touch fills the 4 GB fast tier, the rest goes to CXL
        migrationPolicy = "freqThreshold";
        migrationTriggerPolicy = "fixed";
        migrationIntervalAccesses = 10000000L;  # epoch = 10 M accesses to the tiering memory
        DRAMSizeMB = 2048L;                      # DDR5 fast tier capacity (4096 = the paper's 4 GB)
        migrationTraffic = "real";               # real: promotions/demotions are 64-line reads + 64-line writes on the tiers
        migrationMaxPagesPerInterval = 512L; # promotions per epoch
        migrationHotThreshold = 8L;              # accesses per epoch to become a promotion candidate
        migrationCostCyclesPerPage = 0L;         # penalty model off (real traffic instead)
        migrationBandwidthCapMB = 1048576L;      # legacy cap, not binding
        cxlBwCongestionEnabled = false;
        cxlHoLBlockingEnabled = false;
        DDR = {
            type = "DDR";                        # zsim DDRMemory, the paper's DDR5 block
            tech = "DDR5-2666-CL20";
            ranksPerChannel = 2;
            banksPerRank = 8;
            controllers = 1;
        };
        CXL = {
            type = "CXL";                        # CXRay zsim CXL model wrapping the same DDR5 backend
            tech = "DDR5-2666-CL20";
            ranksPerChannel = 2;
            banksPerRank = 8;
            controllers = 1;
            hostOverheadNs = 97;                 # CXL 2.0 Gen5: floor = 97 + 2*24 = 145 ns (M1 block)
            linkOneWayNs   = 24;
            creditLimitReq = 32;                 # M2S_REQ credits (0 = pool disabled)
            creditLimitRwd = 16;                 # M2S_RWD credits (0 = pool disabled)
            fixedLatencyOffset = 0;
        };
    };
};
sim = {
    strictConfig = false;
    gmMBytes = 98304;
    maxTotalInstrs = 40000000000L;
    statsPhaseInterval = 5000;
    deadlockDetection = false;
    aslr = true;
};
process0 = {
    env = "OMP_NUM_THREADS=16 OMP_PROC_BIND=false KMP_AFFINITY=disabled GOMP_CPU_AFFINITY=";
    command = "/path/to/scratch/workloads/bin/xgboost_train --data /path/to/scratch/workloads/datasets/HIGGS.csv --max_depth 25 --num_rounds 2000 --nthread 16";
    startFastForwarded = true;
};
