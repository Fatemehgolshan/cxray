// Tiering system: simple fixed-latency DDR + CXL, aggressive SRAM caches.
// "Zddr" = zero-congestion DDR model (DDRMemory with standard timing params).
patchSchedAffinity = true;     # avoids 0x0 mask stalls; required for ML thread pools
sys = {
    cores = {
        c = {
            cores = 16;
            type = "OOO";
            dcache = "l1d";
            icache = "l1i";
        };
    };

caches = {
        # 16 private L1-D slices (one per core)
        # Modern Intel: 48 KiB L1-D, 12-way
        l1d = {
            caches  = 16;          # MUST match simple.cores
            size    = 49152;       # 48 KiB (modern size)
            latency = 5;           # Modern L1D latency
            array = { type = "SetAssoc"; ways = 12; };
            mshrs = 64;            # AGGRESSIVE: Large MSHRs for many outstanding L1 misses
            targets = 16;          # Multiple targets per MSHR
        };

        # 16 private L1-I slices (one per core)
        # Modern Intel: 32 KiB L1-I, 8-way
        l1i = {
            caches  = 16;          # MUST match simple.cores
            size    = 32768;       # 32 KiB
            latency = 3;
            array = { type = "SetAssoc"; ways = 8; };
            mshrs = 32;            # Aggressive MSHRs for instruction fetches
            targets = 8;
        };

        # Private L2 per core
        # Smaller than modern (2 MB) to stress memory: 768 KiB per core
        l2 = {
            caches   = 16;
            size     = 786432;     # 768 KiB (smaller than modern 2MB to not filter too much)
            latency  = 14;         # Modern L2 latency (~13-15 cycles)
            array = { type = "SetAssoc"; ways = 12; };
            children = "l1i|l1d";
            mshrs = 96;            # AGGRESSIVE: Very large MSHRs for memory pressure
            targets = 32;          # Many targets per MSHR
        };

        # Shared L3
        # Scaled for 16 cores: Modern Intel ~1.5-2 MB/core, using 0.75 MB/core = 12 MB total
        # Keeping it smaller to stress memory bandwidth
        l3 = {
            type = "Timing";
            caches   = 1;
            banks    = 16;          # 16 banks for good parallelism
            size     = 12582912;    # 12 MiB (0.75 MB per core, smaller to stress memory)
            latency  = 44;          # Modern L3 latency (~40-50 cycles)
            array = { type = "SetAssoc"; hash = "H3"; ways = 12; };
            children = "l2";
            mshrs = 128;            # AGGRESSIVE: Very large MSHRs for maximum outstanding memory requests
            targets = 64;           # Many targets per MSHR for coalescing
        };
    };

    frequency = 2700;
    lineSize = 64;

    mem = {
          type = "Tiering";
          pageSize = 4096L;
          placementPolicy = "slowFirst";    # fastFirst, random
          migrationPolicy = "none";    # robStallBased, freqBased, none
          migrationTriggerPolicy = "fixed" # fixed, aolBased, latencyBased
          robStallMetric = "robStallCycles";
          //aolLowCycles  = 8.0;
          //aolHighCycles = 25.0;
          migrationIntervalAccesses = 10000000L;
          DRAMSizeMB = 1024L;
          controllers = 1;

          # --- Tunable migration parameters (swept by run_sweep.py) ---
          fscAlpha = 0.001;
          emaLambda = 0.3;
          stabilityGamma = 0.05;
          cxlBaselineLatency = 0.0;       # 0 = auto-calibrate (falls back to 1000 for DDR model)
          robStallMinThresholdCycles = 0L;
          migrationCostCyclesPerPage = 200L;  # overhead model: cycles per 4KB page migrated
          migrationBandwidthCapMB    = 4096L; # cap: 1GB of data migrated per interval

          # Model A: CXL link bandwidth congestion (non-linear latency past bandwidth knee)
          cxlBwCongestionEnabled     = false;
          cxlKneeThreshold           = 0.7;
          cxlPeakCongestionLatency   = 5000L;

          # Model B: CXL head-of-line blocking (serialized shared link, multi-core)
          cxlHoLBlockingEnabled      = false;
          cxlHoLCyclesPerCore        = 300L;

          DDR = {
              type = "DDR";
              tech = "DDR5-2666-CL20";
              ranksPerChannel = 4;
              banksPerRank = 8;
              controllers = 1;
          };

          CXL = {
              type = "DDR";
              tech = "DDR5-2666-CL20";
              ranksPerChannel = 4;
              banksPerRank = 8;
              fixedLatencyOffset = 150;    # ~60ns CXL link overhead
              controllers = 1;
          };
   };
};
sim = {
    strictConfig = false;
    gmMBytes = 32768;
    maxTotalInstrs = 100000000000L;   # smaller cap for a quick smoke-test
    deadlockDetection = false;
};

process0 = {
  command = "ls";
};
