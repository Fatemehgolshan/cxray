// Baseline: 4-core OOO + DDR5 memory only
// Workload: bfs on twitter graph
patchSchedAffinity = true;
sys = {
    cores = {
        c = {
            cores = 4;
            type = "OOO";
            dcache = "l1d";
            icache = "l1i";
        };
    };
    caches = {
        // L1d: 48 KiB, 12-way → 64 sets (2^6) ✓
        l1d = { caches = 4; size = 49152;  latency = 5;  array = { type = "SetAssoc"; ways = 12; }; mshrs = 32; };
        // L1i: 32 KiB, 8-way → 64 sets (2^6) ✓
        l1i = { caches = 4; size = 32768;  latency = 3;  array = { type = "SetAssoc"; ways = 8; }; mshrs = 16; };
        // L2: 512 KiB, 8-way → 1024 sets (2^10) ✓
        l2  = { caches = 4; size = 524288; latency = 14; array = { type = "SetAssoc"; ways = 8; }; mshrs = 48; children = "l1i|l1d"; };
        // L3: 8 MiB, 16-way → 8192 sets (2^13) ✓
        l3  = { type = "Timing"; caches = 1; banks = 4; size = 8388608; latency = 44;
                array = { type = "SetAssoc"; hash = "H3"; ways = 16; };
                children = "l2"; mshrs = 64; };
    };
    frequency = 2700;
    lineSize = 64;
    mem = {
        type = "DDR";
        tech = "DDR5-2666-CL20";
        ranksPerChannel = 2;
        banksPerRank = 8;
        controllers = 1;
    };
};
sim = {
    strictConfig = false;
    gmMBytes = 4096;
    maxTotalInstrs = 500000000L;
    deadlockDetection = false;
    aslr = true;
};
process0 = {
    env = "OMP_PROC_BIND=false KMP_AFFINITY=disabled GOMP_CPU_AFFINITY=";
    command = "/path/to/scratch/workloads/bin/bfs -f /path/to/scratch/workloads/graphs/twitter.sg -n64";
};
