// Intel Xeon Gold 6248 model — 32 cores — DDR memory
// L1D/I: 32KB 8-way  L2: 1MB 16-way (per-core)  L3: 28MB 14-way shared (banks=16)
// CXL 3.1 Gen5x8: hostOverheadNs=97 linkOneWayNs=24
patchSchedAffinity = true;
sys = {
    cores = {
        c = {
            cores = 32;
            type = "OOO";
            dcache = "l1d";
            icache = "l1i";
        };
    };
    caches = {
        l1d = { caches = 32; size = 32768;    latency = 5;  array = { type = "SetAssoc"; ways = 8;  }; mshrs = 16; };
        l1i = { caches = 32; size = 32768;    latency = 4;  array = { type = "SetAssoc"; ways = 8;  }; mshrs = 8;  };
        l2  = { caches = 32; size = 1048576;  latency = 14; array = { type = "SetAssoc"; ways = 16; }; mshrs = 32; children = "l1i|l1d"; };
        l3  = { type = "Timing"; caches = 1; banks = 16; size = 29360128; latency = 44;
                array = { type = "SetAssoc"; hash = "H3"; ways = 14; };
                children = "l2"; mshrs = 512; };
    };
    frequency = 2700;
    lineSize = 64;
    mem = {
        type = "DDR";
        tech = "DDR5-2666-CL20";
        ranksPerChannel = 2;
        banksPerRank = 8;
    };
};
sim = {
    strictConfig = false;
    gmMBytes = 4096;
    maxTotalInstrs = 500000000L;
    deadlockDetection = false;
    aslr = true;
};
process0 = {
    env = "OMP_NUM_THREADS=32 OMP_PROC_BIND=false KMP_AFFINITY=disabled GOMP_CPU_AFFINITY=";
    command = "/tmp/mt_chase2";
};
